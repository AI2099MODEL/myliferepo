<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1b2e4b"/>
      <stop offset="60%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#060e18"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#b8935a"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#85581a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with leather texture corners -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Corner Rivets -->
  <circle cx="28" cy="28" r="4" fill="url(#goldGrad)"/>
  <circle cx="164" cy="28" r="4" fill="url(#goldGrad)"/>
  <circle cx="28" cy="164" r="4" fill="url(#goldGrad)"/>
  <circle cx="164" cy="164" r="4" fill="url(#goldGrad)"/>
  
  <!-- Monogram Logo -->
  <text x="96" y="118" font-family="'Cinzel', serif" font-size="76" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">M</text>
  
  <!-- AI Sparkle Top Right -->
  <path d="M 132 50 Q 132 60 142 60 Q 132 60 132 70 Q 132 60 122 60 Q 132 60 132 50 Z" fill="#fef08a" filter="url(#glow)"/>
</svg>
